
<div class="results-header">
    Results ({{ data?.total ?? 0 }})
</div>

<kendo-grid   [data]="data"
  [sortable]="true"
  [pageable]="true"
  [skip]="state.skip"
  [pageSize]="state.take"
  (dataStateChange)="stateChange.emit($event)"
  [height]="330">
    <kendo-grid-column field="dateRequest" title="Date Request" [width]="150"  format="{0:dd/MM/yyyy}"></kendo-grid-column>
    <kendo-grid-column field="idRequest" title="Id Request" [width]="80"></kendo-grid-column>
    <kendo-grid-column field="idPortfolio" title="Id Portfolio" [width]="150"></kendo-grid-column>
    <kendo-grid-column field="client" title="Client" [width]="200"></kendo-grid-column>
    <kendo-grid-column field="debtor" title="Debtor" [width]="200"></kendo-grid-column>
    <kendo-grid-column field="status" title="Status" [width]="120"></kendo-grid-column>
</kendo-grid>
